; ============================================================================================================
; REALMANUAL - CONFIGURATION
; ============================================================================================================
; 0 = disabled, 1 = enabled unless another meaning is explicitly stated.
; Bindings: Wheel:Joy..., Gamepad:Joy..., Handbrake:Joy... use resolved controller roles.
; The game must separately bind its native steering, throttle and brake controls.
; Auto mode chooses the sole connected primary controller; with both connected, ActiveProfile decides.
; On a new speed.exe process, RealManual refreshes its active profile and resets session inputs.
; ============================================================================================================

[Profiles]
; Startup controller preference and manual profile-switch shortcut.
; 0 = Gamepad, 1 = SimRig. Auto mode overrides this when exactly one primary controller is
; connected; otherwise this is the preference.
ActiveProfile=1
; Switch profiles manually (target controller must be available).
ToggleProfileButton=^F12

[JoystickDevices]
; Identify controllers by hardware ID automatically, or specify fixed slots manually.
; 1 = match connected hardware IDs; 0 = use the manual slots below.
AutoEnumerateDevices=1
; Gamepad joystick number in manual mode; ignored in auto mode.
GamepadSlot=2
; Wheel joystick number in manual mode; ignored in auto mode.
WheelSlot=1
; USB handbrake joystick number in manual mode; ignored in auto mode.
HandbrakeSlot=3
; Virtual/physical gamepad VID/PID; required for Gamepad auto-detection.
GamepadHardwareId=VID_054C&PID_05C4
; Wheel VID/PID; required for SimRig auto-detection.
WheelHardwareId=VID_046D&PID_C24F
; Optional separate handbrake VID/PID for auto-detection.
HandbrakeHardwareId=VID_2341&PID_8036

[General]
; Startup logging and on-screen status messages.
; 1 = write startup diagnostics to a log; 0 = disable.
WriteStartupLog=1
; 1 = show brief in-game RealManual status tips; 0 = hide.
EnableToolTips=1
; Temporary status tip lifetime in milliseconds (100-30000).
ToolTipDurationMs=2000

[Hotkeys]
; Configurable keyboard shortcuts. Blank optional shortcuts are disabled.
; Show available hotkeys and current controls.
HelpButton=F1
; Reset RealManual input and transmission tracking.
ResetButton=F2
; Pause/resume RealManual.
PauseButton=F3
; Reload RealManual and reread config.ini.
ReloadButton=^F3
; SimRig only: toggle H-pattern/sequential.
ToggleTransmissionModeButton=F4
; SimRig only: invert sequential shifter direction.
ToggleSequentialShifterInvertButton=+F4
; Toggle maximum available forward gear.
ToggleMaxForwardGearButton=^F4
; Toggle whether clutch is required for shifts.
ToggleClutchRequiredButton=F5
; Toggle clutch-to-neutral simulation.
ToggleClutchNeutralButton=+F5
; SimRig only: toggle the H-shifter handbrake option.
ToggleShifterHandbrakeButton=F6
; Enable/disable simulated stalling and ignition.
ToggleStallingButton=F7
; Start/stop the stopwatch.
StopwatchButton=F8
; Record a stopwatch lap.
StopwatchLapButton=+F8
; Clear the stopwatch display.
StopwatchClearButton=^F8
; Show shift statistics.
StatsShiftsButton=F9
; Show stall statistics.
StatsStallsButton=+F9
; Show race-restart statistics.
StatsRaceRestartsButton=^F9
; Record a race restart.
RaceRestartButton=F10
; Optional NVIDIA instant-replay shortcut; blank = disabled.
SaveInstantReplayButton=
; Optional NVIDIA screenshot shortcut; blank = disabled.
CaptureScreenshotButton=

[GameKeys]
; Keyboard controls RealManual sends; these must match NFSMW keyboard bindings.
; NFSMW accelerator keyboard binding (also used for engine blips).
ForwardKey=w
; NFSMW reverse/brake keyboard binding for optional reverse assist.
ReverseKey=s
; NFSMW keyboard handbrake binding for RealManual output.
HandbrakeKey=Space
; NFSMW keyboard upshift binding.
ShiftUpKey=e
; NFSMW keyboard downshift binding.
ShiftDownKey=q

[Timing]
; How long generated keys are held and how often RealManual checks inputs.
; Length of generated key taps in milliseconds (1-250).
KeyHoldMs=18
; Time between focused-game input scans in milliseconds (1-100).
ScanIntervalMs=5

[Stopwatch]
; Stopwatch update and display settings.
; Elapsed-time display refresh in milliseconds (20-1000).
StopwatchRefreshMs=50
; Maximum visible stopwatch lines (1-50).
StopwatchMaxLines=10

[Statistics]
; Persistent counters and the optional one-time clear on startup.
; 1 = save shift counts; 0 = stop tracking.
TrackShifts=1
; 1 = save simulated stall counts; 0 = stop tracking.
TrackStalls=1
; 1 = save race-restart counts; 0 = stop tracking.
TrackRaceRestarts=1
; Set 1 to clear all-time statistics once at startup; reset to 0 afterward.
ClearAllTimeOnStartup=0

; ============================================================================================================
; SIMRIG PROFILE
; ============================================================================================================

[Profile.SimRig.Hotkeys]
; Wheel-specific ignition input.
; G29 button for ignition shutoff/restart.
IgnitionButton=Wheel:Joy24

[Profile.SimRig.Transmission]
; SimRig starting transmission and maximum forward gear.
; 0 = H-pattern at startup, 1 = sequential.
StartInSequentialMode=0
; Highest selectable forward gear: 5 or 6.
MaxForwardGear=6

[Profile.SimRig.Clutch]
; G29 clutch mapping, polarity and clutch engagement behavior.
; 1 = clutch required to shift, 0 = clutch optional.
RequireClutch=1
; 1 = hold neutral while clutch is pressed; re-engage on release.
ClutchActsAsNeutral=1
; G29 clutch axis (wheel role resolves to its current joystick slot).
ClutchAxis=Wheel:JoyY
; 1 = axis rises when clutch is depressed; 0 = axis falls.
ClutchAxisIncreasesWhenPressed=0
; Clutch considered pressed below this RELEASE percentage (0 = fully depressed, 100 =
; released).
ClutchThreshold=40

[Profile.SimRig.Pedals]
; G29 combined or independent pedal readings for RealManual telemetry.
; 1 = throttle and brake share one axis; 0 = independently mapped axes.
UseCombinedPedals=0
; Combined G29 throttle/brake axis; used only when UseCombinedPedals=1 (center = 50).
CombinedPedalAxis=
; 1 = brake axis increases when pressed; 0 = decreases. Works in both modes.
BrakeAxisIncreasesWhenPressed=0
; Independent throttle axis; required only when UseCombinedPedals=0.
ThrottleAxis=Wheel:JoyZ
; Independent brake axis; required only when UseCombinedPedals=0.
BrakeAxis=Wheel:JoyR
; Independent throttle polarity: 1 = increases, 0 = decreases; ignored in combined mode.
ThrottleAxisIncreasesWhenPressed=0
; Normalized brake actuation (%) considered active in either pedal mode.
BrakeActivePercent=10

[Profile.SimRig.HPattern]
; G29 H-shifter button assignments for direct gear selection.
; H-pattern first-gear switch.
Gear1Button=Wheel:Joy13
; H-pattern second-gear switch.
Gear2Button=Wheel:Joy14
; H-pattern third-gear switch.
Gear3Button=Wheel:Joy15
; H-pattern fourth-gear switch.
Gear4Button=Wheel:Joy16
; H-pattern fifth-gear switch.
Gear5Button=Wheel:Joy17
; H-pattern sixth-gear switch.
Gear6Button=Wheel:Joy18
; H-pattern reverse switch.
ReverseButton=Wheel:Joy19

[Profile.SimRig.Sequential]
; SimRig sequential shift inputs, paddles and brake-hold recovery.
; 1 = swap up/down direction of physical sequential-shifter slots.
InvertSequentialShifter=1
; G29/H-shifter slot used for sequential upshift.
SequentialUpshiftButton=Wheel:Joy15
; G29/H-shifter slot used for sequential downshift.
SequentialDownshiftButton=Wheel:Joy16
; Native game upshift paddle, monitored to keep tracked gear synchronized.
PaddleUpshiftButton=Wheel:Joy5
; Native game downshift paddle, monitored to keep tracked gear synchronized.
PaddleDownshiftButton=Wheel:Joy6
; 1 = restore tracked first gear after sustained hard braking.
EnableBrakeHoldGearReset=1
; Hard-brake hold duration needed for reset, in ms (100-10000).
BrakeHoldResetMs=2000
; Normalized brake actuation (%) that starts the brake-hold timer.
BrakeResetPercent=40
; Delay between sequential shifts queued during a clutch hold, in ms (1-1000).
QueuedShiftDelayMs=35

[Profile.SimRig.Handbrake]
; Choose NFSMW-native or RealManual handbrake handling.
; 1 = RealManual drives HandbrakeKey; 0 = map external lever directly inside NFSMW.
RealManualControlsHandbrake=1
; External USB handbrake input (used only when RealManual controls the lever).
HandbrakeAxis=Handbrake:JoyR
; Optional H-shifter gear slot used as a separate handbrake.
ShifterHandbrakeButton=Wheel:Joy14
; 1 = allow H-shifter handbrake in sequential mode; independent of external routing.
EnableShifterHandbrake=0
; External lever polarity: 1 = increases when pulled, 0 = decreases.
HandbrakeAxisIncreasesWhenPulled=1
; Normalized lever actuation (%) that engages RealManual handbrake; ignored in native
; mode.
HandbrakeThreshold=20

[Profile.SimRig.Stalling]
; Simulated stalling, restart and engine-off timing for SimRig.
; 1 = enable simulated stalling and engine shutoff/restart.
EnableStalling=1
; Clutch RELEASE percentage at which a low-throttle stall may occur.
ClutchReleaseThreshold=60
; Minimum normalized throttle (%) needed to avoid a low-speed stall.
ThrottleThreshold=15
; Maximum clutch RELEASE percentage allowed for restart when clutch is required.
RestartClutchThreshold=15
; Interval between forced neutral updates while engine is off, in ms.
NeutralResendMs=50
; Duration of synthetic throttle blips for engine effects, in ms.
ThrottleBlipMs=500
; Time first gear may remain coupled without enough throttle, in ms.
NoInputStallDelayMs=700
; Temporary stall immunity after brake-hold gear reset, in ms.
BrakeResetStallGraceMs=100

[Profile.SimRig.ReverseAssist]
; Optional SimRig-only reverse-key assistance.
; 1 = assist reverse key output based on braking (SimRig only).
EnableReverseAssist=1
; Normalized brake (%) that activates reverse assist; releases at BrakeActivePercent.
EngageBrakePercent=20

; ============================================================================================================
; GAMEPAD PROFILE
; ============================================================================================================

[Profile.Gamepad.Transmission]
; Gamepad is always sequential; configure its maximum forward gear.
; Highest forward gear: 5 or 6; Gamepad is always sequential.
MaxForwardGear=6

[Profile.Gamepad.Clutch]
; Gamepad clutch-required and clutch-to-neutral options.
; 1 = clutch required to shift, 0 = clutch optional.
RequireClutch=1
; 1 = select neutral while clutch is pressed.
ClutchActsAsNeutral=1
; Clutch considered pressed below this normalized RELEASE percentage.
ClutchThreshold=40

[Profile.Gamepad.Inputs]
; Controller inputs used by RealManual; native NFSMW driving bindings are separate.
; Joystick axes, buttons, keyboard keys and POV directions are inferred from the binding.
; For POV inputs, add <Action>POVDirection=0/4500/.../31500 to this section.
; Clutch control (default L2 analog trigger).
ClutchSource=Gamepad:JoyV
; Throttle telemetry for stall simulation (default R2); bind driving throttle in NFSMW.
ThrottleSource=Gamepad:JoyU
; Brake telemetry for brake-hold/stall logic (default right stick vertical).
BrakeSource=Gamepad:JoyR
; Handbrake source when RealManual routing is enabled (default Square).
HandbrakeSource=Gamepad:Joy1
; 0 = NFSMW uses its native binding; 1 = RealManual sends HandbrakeKey.
RealManualControlsHandbrake=0
; RealManual sequential upshift input (default R1).
UpshiftSource=Gamepad:Joy6
; RealManual sequential downshift input (default L1).
DownshiftSource=Gamepad:Joy5
; Engine shutoff/restart input (default right stick UP).
IgnitionSource=Gamepad:JoyR

[Profile.Gamepad.AxisCalibration]
; Physical positions for analog sources only; digital sources ignore these endpoints.
; Released/Pressed are physical axis positions from 0 to 100, not logical clutch state.
; A decreasing axis is supported (e.g. ignition 50 -> 0).
; Clutch source raw position at rest (L2 = 0).
ClutchReleased=0
; Clutch source raw position fully pressed (L2 = 100).
ClutchPressed=100
; Throttle source raw position at rest (R2 = 0).
ThrottleReleased=0
; Throttle source raw position fully pressed (R2 = 100).
ThrottlePressed=100
; Brake source raw position without braking (stick centered = 50).
BrakeReleased=50
; Brake source raw position fully braking (stick down = 100).
BrakePressed=100
; Handbrake axis raw position when released; ignored for digital inputs.
HandbrakeReleased=0
; Handbrake axis raw position at full pull; ignored for digital inputs.
HandbrakePressed=100
; Upshift axis raw position when released; ignored for digital inputs.
UpshiftReleased=0
; Upshift axis raw position when fully pressed; ignored for digital inputs.
UpshiftPressed=100
; Downshift axis raw position when released; ignored for digital inputs.
DownshiftReleased=0
; Downshift axis raw position when fully pressed; ignored for digital inputs.
DownshiftPressed=100
; Ignition axis raw position at rest (right stick centered = 50).
IgnitionReleased=50
; Ignition axis raw position at full activation (right stick UP = 0).
IgnitionPressed=0

[Profile.Gamepad.Activation]
; Hysteresis when an analog source performs a digital action.
; For analog-to-digital actions only. Activation must exceed release (hysteresis).
; Digital buttons, keyboard keys and POV directions are immediate; no thresholds needed.
; Analog percentage needed to activate upshift, downshift or ignition.
AnalogActivationPercent=60
; Analog percentage at/below which those actions rearm (must be below activation).
AnalogReleasePercent=40
; Analog percentage needed to engage RealManual-controlled handbrake.
AnalogHandbrakeActivationPercent=20
; Analog percentage at/below which handbrake releases.
AnalogHandbrakeReleasePercent=15

[Profile.Gamepad.Sequential]
; Gamepad sequential brake-hold reset and queued shift timing.
; 1 = sustained braking restores tracked first gear.
EnableBrakeHoldGearReset=1
; Time brake must remain above the reset threshold, in ms.
BrakeHoldResetMs=2000
; Normalized brake actuation (%) required for brake-hold reset.
BrakeResetPercent=40
; Milliseconds between queued shifts after clutch release.
QueuedShiftDelayMs=35

[Profile.Gamepad.Stalling]
; Gamepad engine-stall and restart thresholds and timing.
; 1 = enable controller ignition and simulated engine stalling.
EnableStalling=1
; Clutch RELEASE percentage where low-throttle stall detection begins.
ClutchReleaseThreshold=60
; Minimum normalized throttle (%) needed to prevent stall.
ThrottleThreshold=15
; Maximum clutch RELEASE percentage allowed to restart (when required).
RestartClutchThreshold=15
; Milliseconds between neutral keepalive sends while engine is off.
NeutralResendMs=50
; Milliseconds to hold a synthetic throttle blip during engine effects.
ThrottleBlipMs=500
; Milliseconds first gear may remain engaged at insufficient throttle.
NoInputStallDelayMs=700
; Milliseconds of stall protection after brake-hold recovery.
BrakeResetStallGraceMs=100
; Normalized Gamepad brake (%) treated as actively pressed.
BrakeActivePercent=10
