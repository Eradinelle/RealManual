[Startup]
WriteStartupLog=1

[LiveHotkeys]
EnableLiveHotkeys=1

[Hotkeys]
ResetButton=F10
PauseButton=F8
ReloadButton=^F9
ToggleTransmissionButton=F11
ToggleSequentialInvertButton=+F11
ToggleFiveGearModeButton=^F11
ToggleClutchButton=F12
ToggleNeutralButton=+F12
ToggleShifterHandbrakeButton=F9
ToggleShifterHandbrakeInvertButton=+F9
IgnitionButton=1Joy24
ToggleStallingButton=+F10

[Notifications]
EnableToolTips=1
ToolTipDurationMs=2000

[Mode]
TransmissionIsSequential=0
InvertSequentialAxis=1
RequireClutch=1
ClutchActsAsNeutral=1
MaxForwardGear=6
EnableHandbrake=1
EnableReverse=1
EnableSyncHotkeys=1

[Timing]
KeyHoldMs=18
ScanIntervalMs=8

[Thresholds]
ClutchThreshold=40
HandbrakeThreshold=20

[Axes]
ClutchAxis=1JoyY
HandbrakeAxis=2JoyR

[OutputKeys]
Gear1Key=1
Gear2Key=2
Gear3Key=3
Gear4Key=4
Gear5Key=5
Gear6Key=6
NeutralKey=n
ForwardKey=Up
ReverseKey=s
HandbrakeKey=Space
ShiftUpKey=e
ShiftDownKey=q

[ShifterButtons]
Gear1Button=1Joy13
Gear2Button=1Joy14
Gear3Button=1Joy15
Gear4Button=1Joy16
Gear5Button=1Joy17
Gear6Button=1Joy18
ReverseButton=1Joy19

[ShifterHandbrake]
EnableShifterHandbrake=0
InvertShifterHandbrake=0
NormalButton=1Joy16
InvertedButton=1Joy15

[Sequential]
