; =============================================================================
; REALMANUAL CONFIGURATION
; =============================================================================
;
; Boolean settings:
;   0 = Disabled / False
;   1 = Enabled / True
;
; Hotkeys:
;   Leave a hotkey value blank to disable that hotkey.
;   AutoHotkey modifiers: ^ = Ctrl, + = Shift, ! = Alt, # = Win
;
; Controller input examples:
;   1Joy13 = joystick 1, button 13
;   2JoyY  = joystick 2, Y axis
;
; Game keys must match the keyboard controls configured inside NFSMW.
; =============================================================================


[General]
; Write startup_log.txt when RealManual starts.
; 0 = Disabled, 1 = Enabled. Default = 1.
WriteStartupLog=1

; Show RealManual status / mode tooltips.
; 0 = Disabled, 1 = Enabled. Default = 1.
EnableToolTips=1

; Duration of temporary status tooltips in milliseconds.
; Valid range: 100-30000. Default = 2000.
ToolTipDurationMs=2000


[Hotkeys]
; General controls.
HelpButton=F1
ResetButton=F2
PauseButton=F3
ReloadButton=^F3

; Transmission controls.
ToggleTransmissionModeButton=F4
ToggleSequentialShifterInvertButton=+F4
ToggleMaxForwardGearButton=^F4

; Clutch controls.
ToggleClutchRequiredButton=F5
ToggleClutchNeutralButton=+F5

; Shifter-handbrake controls.
ToggleShifterHandbrakeButton=F6

; Stalling / ignition controls.
ToggleStallingButton=F7
IgnitionButton=1Joy24

; Stopwatch controls.
StopwatchButton=F8
StopwatchLapButton=+F8
StopwatchClearButton=^F8

; Statistics controls.
StatsShiftsButton=F9
StatsStallsButton=+F9
StatsRaceRestartsButton=^F9
RaceRestartButton=F10

; Utility / capture controls.
; Max video settings hardcoded for my specific use case - see documentation
MaxVideoSettingsButton=F11
SaveInstantReplayButton=
CaptureScreenshotButton=


[Transmission]
; Startup transmission mode.
; 0 = H-pattern, 1 = Sequential. Default = 0.
StartInSequentialMode=0

; Maximum selectable forward gear.
; Valid values: 5 or 6. Default = 6.
MaxForwardGear=6


[Clutch]
; Require clutch input for normal gear changes.
; 0 = Disabled, 1 = Enabled. Default = 1.
RequireClutch=1

; Send neutral while the clutch is pressed, then re-engage on release.
; 0 = Disabled, 1 = Enabled. Default = 1.
ClutchActsAsNeutral=1

; Physical clutch axis.
ClutchAxis=1JoyY

; Raw clutch-axis value below which the clutch is considered pressed.
; Valid range: 1-99. Default = 40.
ClutchThreshold=40


[Pedals]
; Shared gas/brake axis used by brake reset, reverse assist, and stall logic.
; RealManual expects the combined-pedal axis rather than separate throttle/brake axes.
CombinedPedalAxis=1JoyZ

; Resting center of the shared gas/brake axis.
; Valid range: 1-99, but this should never not be 50. Default = 50. 
CombinedPedalCenter=50

; Direction of the brake side of the shared axis.
; 0 = brake decreases the axis value
; 1 = brake increases the axis value. Default = 1.
BrakeAxisIncreasesWhenPressed=1

; Threshold used to decide whether ordinary brake input is active/released.
; Valid range: 1-99. Default = 55.
BrakeActiveThreshold=55


[GameKeys]
; These keys must match the keyboard controls configured inside NFSMW.
; They are outputs sent by RealManual and are also used where physical keyboard
; shift synchronization is required.
ForwardKey=w
ReverseKey=s
HandbrakeKey=Space
ShiftUpKey=e
ShiftDownKey=q


[HPattern]
; Physical H-pattern shifter positions.
Gear1Button=1Joy13
Gear2Button=1Joy14
Gear3Button=1Joy15
Gear4Button=1Joy16
Gear5Button=1Joy17
Gear6Button=1Joy18
ReverseButton=1Joy19


[Sequential]
; Swap the physical sequential-shifter upshift/downshift directions.
; 0 = Normal, 1 = Inverted. Default = 0.
InvertSequentialShifter=1

; Physical H-shifter slots used as sequential upshift/downshift inputs.
SequentialUpshiftButton=1Joy15
SequentialDownshiftButton=1Joy16

; Native paddle inputs used only to keep RealManual's tracked gear synchronized.
PaddleUpshiftButton=1Joy5
PaddleDownshiftButton=1Joy6

; Reset the tracked sequential gear to first after sustained hard braking.
; 0 = Disabled, 1 = Enabled. Default = 1.
EnableBrakeHoldGearReset=1

; Hard-brake hold time required before the sequential reset triggers.
; Valid range: 100-10000 ms. Default = 2000.
BrakeHoldResetMs=2000

; Hard-brake threshold used only for the sequential brake-hold reset.
; Valid range: 1-99. Default = 70.
BrakeResetThreshold=70

; Delay between queued sequential shift outputs after clutch release.
; Valid range: 1-1000 ms. Default = 35.
QueuedShiftDelayMs=35


[Handbrake]
; Optional analog handbrake axis.
HandbrakeAxis=2JoyR

; Analog handbrake activation threshold.
; Valid range: 1-99. Default = 20.
HandbrakeThreshold=20

; Allows one H-shifter slot to act as a handbrake in sequential mode.
; 0 = Disabled, 1 = Enabled. Default = 0.
EnableShifterHandbrake=0

; H-shifter slot used as the handbrake in sequential mode.
; I recommend 2nd gear because it does not overlap the default
; sequential upshift/downshift slots.
ShifterHandbrakeButton=1Joy14


[Stalling]
; Enable simulated engine stalling behavior.
; 0 = Disabled, 1 = Enabled. Default = 0.
EnableStalling=1

; Clutch release percentage where coupled first-gear stall logic becomes active.
; Valid range: 1-99. Default = 60.
ClutchReleaseThreshold=60

; Minimum estimated throttle percentage required to prevent a stall.
; Valid range: 0-100. Default = 15.
ThrottleThreshold=15

; Maximum clutch release percentage allowed for restart when clutch is required.
; Valid range: 0-99. Default = 15.
RestartClutchThreshold=15

; Interval between forced neutral keepalive commands while the engine is off.
; Valid range: 50-1000 ms. Default = 50.
NeutralResendMs=50

; Duration of simulated throttle blips used by stall / restart effects.
; Valid range: 1-2000 ms. Default = 500.
ThrottleBlipMs=500

; Time first gear may remain coupled at low throttle before stalling.
; Valid range: 0-1500 ms. Default = 700.
NoInputStallDelayMs=700

; Stall-protection grace period after sequential brake-reset brake release.
; Valid range: 0-1000 ms. Default = 100.
BrakeResetStallGraceMs=100


[ReverseAssist]
; Enable digital reverse-key assistance while reversing.
; 0 = Disabled, 1 = Enabled. Default = 0.
EnableReverseAssist=1

; Brake threshold required to engage reverse assist.
; Release still follows BrakeActiveThreshold from [Pedals].
; Valid range: 1-99. Default = 60.
EngageBrakeThreshold=60


[Timing]
; Advanced timing values. The defaults should work for most systems.

; Duration of normal synthetic key taps.
; Valid range: 1-250 ms. Default = 18.
KeyHoldMs=18

; Focused-game MainLoop polling interval.
; Valid range: 1-100 ms. Default = 5.
ScanIntervalMs=5


[Stopwatch]

; Stopwatch display refresh interval while running.
; Valid range: 20-1000 ms. Default = 50.
StopwatchRefreshMs=50

; Maximum number of displayed stopwatch lines, including the active timer.
; Valid range: 1-50. Default = 10.
StopwatchMaxLines=10


[Statistics]
; Enable persistent tracking for each statistic.
TrackShifts=1
TrackStalls=1
TrackRaceRestarts=1

; One-shot startup clear. RealManual resets the flag after consuming it.
ClearAllTimeOnStartup=0
